<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Card - Nour Elhuda M</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Main Color Palette - Metallic Black, White, Gold & Light Gray */
      --color-metallic-black-dark: #0b0c0e;
      --color-metallic-black-mid: #151821;
      --color-metallic-black-light: #242934;
      --color-gold-primary: #e6c065;
      --color-gold-light: #fbf0cb;
      --color-gold-muted: #bd9a42;
      --color-text-white: #ffffff;
      --color-accent-gray: #e2e6ee;
      --color-gray-disabled: #4b5563;
      --color-card-edge: rgba(255, 255, 255, 0.35);

      /* Typography - Bold Livvic Font */
      --font-family-system: 'Livvic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Card Physical Dimensions (Standard ID-1 ISO/IEC 7810 Bank Card) */
      --card-aspect-ratio: 85.6 / 54;
      --card-radius: 12px;
      --card-width-print: 85.6mm;
      --card-height-print: 54mm;
      
      /* Spacing Variables */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 14px;
      --spacing-lg: 20px;

      /* Animation & Shadows */
      --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      --card-shadow-default: 0 25px 50px -12px rgba(0, 0, 0, 0.95), 0 0 30px rgba(230, 192, 101, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family-system);
      font-weight: 600;
      background-color: var(--color-metallic-black-dark);
      /* Enhanced Dynamic Ambient Background Effects */
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(230, 192, 101, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 15% 85%, rgba(60, 70, 95, 0.45) 0%, transparent 50%),
        radial-gradient(circle at 85% 15%, rgba(230, 192, 101, 0.1) 0%, transparent 45%),
        linear-gradient(180deg, #060708 0%, #111319 100%);
      color: var(--color-text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Ambient Glow Sphere in Background */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(230, 192, 101, 0.18) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(50px);
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
    }

    /* Container for 3D Viewport perspective */
    .card-wrapper {
      perspective: 1200px;
      width: 100%;
      max-width: 490px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }

    /* Physical Real-Object Card Container */
    .id-card {
      position: relative;
      width: 100%;
      aspect-ratio: var(--card-aspect-ratio);
      border-radius: var(--card-radius);
      background: linear-gradient(
        135deg,
        var(--color-metallic-black-light) 0%,
        var(--color-metallic-black-mid) 45%,
        var(--color-metallic-black-dark) 100%
      );
      /* Edge Bevel Highlight simulating plastic card thickness */
      box-shadow: 
        var(--card-shadow-default),
        inset 0 1px 1.5px var(--color-card-edge),
        inset 0 -1px 2px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(230, 192, 101, 0.3);
      padding: 18px 20px;
      display: flex;
      gap: 16px;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
      user-select: none;
    }

    /* Subdued Brushed Metallic Overlay Effect */
    .id-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.02) 0px,
        rgba(255, 255, 255, 0.02) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Light Sheen Reflection Effect */
    .card-sheen {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.16) 0%,
        rgba(255, 255, 255, 0.04) 35%,
        transparent 70%
      );
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.3s ease;
    }

    /* Card Left & Right Column Layout */
    .card-left {
      flex: 0 0 38%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 3;
      border-right: 1px solid rgba(230, 192, 101, 0.22);
      padding-right: 14px;
    }

    .card-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 3;
      padding-left: 2px;
    }

    /* Profile Photo Container */
    .avatar-box {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      border: 2px solid var(--color-gold-primary);
      overflow: hidden;
      background-color: var(--color-metallic-black-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-fallback {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--color-gold-muted), var(--color-metallic-black-mid));
      color: var(--color-gold-light);
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 1px;
    }

    .user-name {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--color-text-white);
      letter-spacing: 0.3px;
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .user-title {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--color-gold-primary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 2px;
    }

    .user-org {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--color-accent-gray);
      line-height: 1.2;
    }

    /* Contact Details Section */
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      border-radius: 4px;
      transition: var(--transition-smooth);
    }

    .contact-item:focus-visible {
      outline: 2px solid var(--color-gold-primary);
      outline-offset: 2px;
    }

    .contact-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--color-gold-primary);
      font-weight: 700;
    }

    .contact-value {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--color-accent-gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    a.contact-item:hover .contact-value {
      color: var(--color-text-white);
      text-decoration: underline;
      text-decoration-color: var(--color-gold-primary);
    }

    /* Social Icons Row */
    .social-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .social-link {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: var(--color-gold-primary);
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(230, 192, 101, 0.25);
      transition: var(--transition-smooth);
      text-decoration: none;
      min-width: 44px;
      min-height: 44px;
    }

    .social-link svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .social-link.active:hover {
      background-color: var(--color-gold-primary);
      color: var(--color-metallic-black-dark);
      border-color: var(--color-gold-primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(230, 192, 101, 0.3);
    }

    .social-link.active:focus-visible {
      outline: 2px solid var(--color-gold-primary);
      outline-offset: 2px;
    }

    .social-link.disabled {
      color: var(--color-gray-disabled);
      border-color: rgba(255, 255, 255, 0.05);
      background-color: transparent;
      cursor: not-allowed;
      opacity: 0.4;
    }

    /* Print Button Styling */
    .action-container {
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 5;
    }

    .btn-print {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--color-gold-primary), var(--color-gold-muted));
      color: var(--color-metallic-black-dark);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 900;
      padding: 12px 30px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 16px rgba(230, 192, 101, 0.3);
      transition: var(--transition-smooth);
      min-width: 44px;
      min-height: 44px;
    }

    .btn-print:hover {
      background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold-primary));
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 22px rgba(230, 192, 101, 0.5);
    }

    .btn-print:focus-visible {
      outline: 3px solid var(--color-text-white);
      outline-offset: 3px;
    }

    .btn-print svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Accessibility: Reduced Motion Override */
    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none !important;
      }
      .id-card {
        transition: none !important;
        transform: none !important;
      }
      .card-sheen {
        display: none !important;
      }
      .btn-print {
        transition: none !important;
      }
    }

    /* STRICT PRINT STYLES - Output ONLY the exact 85.6mm x 54mm card */
    @media print {
      @page {
        size: 85.6mm 54mm;
        margin: 0;
      }

      body {
        background: none !important;
        padding: 0 !important;
        margin: 0 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        min-height: 100vh !important;
      }

      body::before {
        display: none !important;
      }

      .action-container,
      .card-sheen {
        display: none !important;
      }

      .card-wrapper {
        perspective: none !important;
        width: 85.6mm !important;
        height: 54mm !important;
        max-width: none !important;
        margin: 0 !important;
      }

      .id-card {
        width: 85.6mm !important;
        height: 54mm !important;
        transform: none !important;
        box-shadow: none !important;
        border: 1px solid #222 !important;
        border-radius: 3.18mm !important;
        padding: 4mm 5mm !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .avatar-box {
        width: 18mm !important;
        height: 18mm !important;
      }

      .user-name {
        font-size: 9pt !important;
      }

      .user-title {
        font-size: 7pt !important;
      }

      .user-org {
        font-size: 6.5pt !important;
      }

      .contact-label {
        font-size: 5.5pt !important;
      }

      .contact-value {
        font-size: 7pt !important;
      }

      .social-link {
        min-width: unset !important;
        min-height: unset !important;
        width: 5mm !important;
        height: 5mm !important;
      }

      .social-link svg {
        width: 3mm !important;
        height: 3mm !important;
      }
    }
  </style>
</head>

  <script>
    /* Plain English Script Section: Controls Image Fallback & Interactive 3D Tilt */

    // Image Error Handler: Shows initials if picture URL fails to load
    function handleImageError(imgElement) {
      imgElement.style.display = 'none';
      const fallback = document.getElementById('avatarFallback');
      if (fallback) {
        fallback.style.display = 'flex';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const card = document.getElementById('identityCard');
      const cardWrapper = card.parentElement;
      const sheen = document.getElementById('cardSheen');

      // Check if user prefers reduced motion
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!prefersReducedMotion && card) {
        // Track mouse movement across wrapper for smooth realistic 3D tilt
        cardWrapper.addEventListener('mousemove', function(e) {
          const rect = card.getBoundingClientRect();
          const cardWidth = rect.width;
          const cardHeight = rect.height;

          // Calculate relative mouse position from center (-0.5 to 0.5)
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;

          const centerX = mouseX - (cardWidth / 2);
          const centerY = mouseY - (cardHeight / 2);

          // Maximum tilt angles (degrees) - subtle enough to keep text readable
          const maxTiltX = 8;
          const maxTiltY = 8;

          const rotateX = (-centerY / (cardHeight / 2)) * maxTiltX;
          const rotateY = (centerX / (cardWidth / 2)) * maxTiltY;

          // Apply 3D rotation transform
          card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;

          // Update sheen center light coordinates (%)
          const sheenX = (mouseX / cardWidth) * 100;
          const sheenY = (mouseY / cardHeight) * 100;
          card.style.setProperty('--mouse-x', sheenX + '%');
          card.style.setProperty('--mouse-y', sheenY + '%');
        });

        // Reset transform when mouse leaves the card area
        cardWrapper.addEventListener('mouseleave', function() {
          card.style.transform = 'rotateX(0deg) rotateY(0deg)';
          card.style.setProperty('--mouse-x', '50%');
          card.style.setProperty('--mouse-y', '50%');
        });
      }
    });
  </script>
